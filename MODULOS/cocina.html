<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Cocina - MAFFIA</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600&family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <!-- NUEVO HEADER -->
    <header class="main-header">
        <div class="header-content">
            <div class="logo-area">
                <div class="logo-icon"><i class="fas fa-dragon"></i></div>
                <div class="logo-text">
                    <h1>MAFFIA</h1>
                    <span>Sistema de Gestión Restaurante Oriental</span>
                </div>
            </div>
            <nav class="main-nav-top">
                <a href="index.html"><i class="fas fa-home"></i> Inicio</a>
                <a href="platos.html"><i class="fas fa-utensils"></i> Platos</a>
                <a href="pedidos.html"><i class="fas fa-clipboard-list"></i> Pedidos</a>
                <a href="cocina.html" class="active"><i class="fas fa-fire"></i></i> Cocina</a>
                <a href="cuenta.html"><i class="fas fa-receipt"></i> Cuenta</a>
            </nav>
        </div>
    </header>

    <div class="container">

        <div class="module-content">

            <!-- ESTADÍSTICAS -->
            <div class="cocina-stats">
                <div class="stat-card-mini pendiente">
                    <i class="fas fa-hourglass-start"></i>
                    <span>Pendientes: <strong id="pendientesCount">0</strong></span>
                </div>
                <div class="stat-card-mini preparacion">
                    <i class="fas fa-fire"></i>
                    <span>En preparación: <strong id="preparacionCount">0</strong></span>
                </div>
                <div class="stat-card-mini listo">
                    <i class="fas fa-check-circle"></i>
                    <span>Listos: <strong id="listosCount">0</strong></span>
                </div>
            </div>

            <!-- FILTROS -->
            <div class="cocina-toolbar">
                <div class="filtros-group">
                    <button class="filter-btn active" data-filter="todos">
                        <i class="fas fa-list"></i> Todos
                    </button>
                    <button class="filter-btn" data-filter="Pendiente">
                        <i class="fas fa-hourglass-start"></i> Pendientes
                    </button>
                    <button class="filter-btn" data-filter="En preparación">
                        <i class="fas fa-fire"></i> En preparación
                    </button>
                    <button class="filter-btn" data-filter="Listo">
                        <i class="fas fa-check-circle"></i> Listos
                    </button>
                    <button class="filter-btn urgente-filter" data-filter="urgente">
                        <i class="fas fa-exclamation-triangle"></i> Solo urgentes
                    </button>
                </div>

                <div class="orden-group">
                    <label for="sortSelect"><i class="fas fa-sort"></i> Ordenar:</label>
                    <select id="sortSelect">
                        <option value="hora">Más antiguo primero</option>
                        <option value="horaDesc">Más reciente primero</option>
                        <option value="tiempo">Mayor tiempo estimado</option>
                        <option value="urgente">Urgentes primero</option>
                    </select>
                </div>
            </div>

            <!-- PEDIDOS -->
            <div id="cocinaPedidos" class="cocina-pedidos"></div>

        </div>

        <footer class="footer">
            <p>&copy; 2027 MAFFIA Restaurante Oriental - Control de Cocina</p>
        </footer>
    </div>

    <div id="toastCocina" class="toast-cocina"></div>

    <script src="cocina.js"></script>
</body>
</html>
