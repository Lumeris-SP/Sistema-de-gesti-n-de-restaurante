<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo Plato - Walok</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <a href="platos.html" class="back-btn"><i class="fas fa-arrow-left"></i> Volver</a>
            <div class="logo-container">
                <i class="fas fa-plus-circle"></i>
                <h1>Módulo de Registro</h1>
            </div>
            <p class="subtitle">Registro rápido de platos</p>
        </header>
        
        <div class="form-container">
            <form id="rapidPlatoForm">
                <div class="form-group">
                    <label>Código *</label>
                    <input type="text" id="rapidCodigo" placeholder="PLXXX">
                </div>
                <div class="form-group">
                    <label>Nombre *</label>
                    <input type="text" id="rapidNombre">
                </div>
                <div class="form-group">
                    <label>Precio *</label>
                    <input type="number" id="rapidPrecio" step="0.01">
                </div>
                <button type="submit" class="btn-primary">Registrar Rápido</button>
            </form>
        </div>
    </div>
    <script src="modulo-plato.js"></script>
</body>
</html>
