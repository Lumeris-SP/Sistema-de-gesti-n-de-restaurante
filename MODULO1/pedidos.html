<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos - Walok</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Inicio</a>
            <div class="logo-container">
                <i class="fas fa-clipboard-list"></i>
                <h1>Pedidos por Mesa</h1>
            </div>
            <p class="subtitle">Gestión de pedidos del restaurante</p>
        </header>

        <div class="module-content">
            <!-- Crear nuevo pedido -->
            <div class="form-container">
                <h2><i class="fas fa-cart-plus"></i> Nuevo Pedido</h2>
                <form id="pedidoForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label><i class="fas fa-chair"></i> Número de Mesa *</label>
                            <input type="number" id="mesa" placeholder="Ej: 1" min="1" max="50">
                            <small class="error-message" id="mesaError"></small>
                        </div>
                        <div class="form-group">
                            <label><i class="fas fa-user"></i> Cliente</label>
                            <input type="text" id="cliente" placeholder="Nombre del cliente (opcional)">
                        </div>
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-hamburger"></i> Seleccionar Platos *</label>
                        <div id="platosDisponibles" class="platos-selector"></div>
                        <small class="error-message" id="platosError"></small>
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-comment"></i> Observaciones especiales</label>
                        <textarea id="observaciones" rows="2" placeholder="Ej: Sin cebolla, extra picante..."></textarea>
                    </div>

                    <button type="submit" class="btn-primary"><i class="fas fa-check-circle"></i> Crear Pedido</button>
                </form>
            </div>

            <!-- Listado de pedidos activos -->
            <div class="list-container">
                <h3><i class="fas fa-list"></i> Pedidos Activos</h3>
                <div id="pedidosList" class="pedidos-list"></div>
            </div>
        </div>

        <footer class="footer">
            <p>&copy; 2024 Walok Restaurante Oriental - Módulo de Pedidos</p>
        </footer>
    </div>

    <script src="pedidos.js"></script>
</body>
</html>
